spring.application.name=backend
spring.config.import=optional:file:../.env[.properties]
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:finance_db}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true
spring.messages.encoding=UTF-8

application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration-ms=${JWT_EXPIRATION_MS}
application.security.jwt.refresh-expiration-days=${REFRESH_EXPIRATION_DAYS}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

application.security.admin.username=${ADMIN_USERNAME}
application.security.admin.email=${ADMIN_EMAIL}
application.security.admin.password=${ADMIN_PASSWORD}


spring.ai.openai.base-url=${OPENAI_BASE_URL}
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=${OPENAI_MODEL}
spring.ai.openai.chat.replay-reasoning-content=false
spring.ai.openai.connect-timeout=10s
spring.ai.openai.read-timeout=60s
spring.ai.model.audio.speech=none

app.timezone=${TZ}

# otp ??ng kí , quên m?t kh?u
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}

# Kênh c?nh báo: g?i c?nh báo khi ngân sách ch?m ng??ng
app.mail.alert.username=${MAIL_ALERT_USERNAME}
app.mail.alert.password=${MAIL_ALERT_APP_PASSWORD}
app.mail.alert.from-name=FinHome Alert