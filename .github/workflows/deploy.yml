
name: IT209 CD - Deploy VPS

on:
  workflow_run:
    workflows:
      - "IT209 CI Pipeline"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: it209-production
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    name: Publish GHCR and Deploy VPS
    runs-on: ubuntu-latest

    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify commit is current main
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$DEPLOY_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/minhmap2302/it209-backend:${{ github.event.workflow_run.head_sha }}
            ghcr.io/minhmap2302/it209-backend:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=
          tags: |
            ghcr.io/minhmap2302/it209-frontend:${{ github.event.workflow_run.head_sha }}
            ghcr.io/minhmap2302/it209-frontend:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ssh \
            -i ~/.ssh/id_deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${VPS_USER}@${VPS_HOST}" \
            "IMAGE_TAG=$DEPLOY_SHA bash -se" <<'REMOTE'
          set -euo pipefail

          cd /opt/it209/Personal_Finance_Management_1Month

          COMPOSE=(
            docker compose
            -f docker-compose.prod.yml
            -f /home/deploy/it209-images.yml
          )

          "${COMPOSE[@]}" config --quiet

          # Only update application images
          "${COMPOSE[@]}" pull backend frontend

          # Preserve existing MySQL container and volume
          "${COMPOSE[@]}" up -d --no-build --no-deps backend
          "${COMPOSE[@]}" up -d --no-build --no-deps frontend

          # Verify frontend responds
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000; then
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "Frontend health check failed"
              exit 1
            fi
            sleep 3
          done

          "${COMPOSE[@]}" ps
          echo "Deployment completed"
          REMOTE
