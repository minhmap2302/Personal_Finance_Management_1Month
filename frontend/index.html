<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Favicon — FinHome green house logo -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=3" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png?v=3" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=3" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />

  <!-- PWA / Android -->
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"/>
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png"/>

  <!-- Theme -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#059669"/>
  <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#34D399"/>

  <title>FinHome — Quản lý chi tiêu gia đình</title>

  <!-- Anti-FOUC: apply theme before any paint -->
  <script>
    (function(){
      try {
        var mode = localStorage.getItem('pfm.theme') || 'light';
        var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.removeAttribute('data-theme');
          document.documentElement.classList.remove('dark');
        }
      } catch(e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
